name: Vulnerability Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Run govulncheck
        run: |
          for module in apps/proxy apps/slm-engine apps/sombra internal/pii pkg/gateway services/refinery services/vault; do
            echo "=== $module ==="
            govulncheck -C "$module" ./... || exit 1
          done
